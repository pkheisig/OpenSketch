<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8f87"/>
      <stop offset="1" stop-color="#8dd5c4"/>
    </linearGradient>
    <radialGradient id="nucleus">
      <stop offset="0" stop-color="#f4c46b"/>
      <stop offset="1" stop-color="#d98239"/>
    </radialGradient>
    <clipPath id="rounded-window">
      <rect x="24" y="24" width="352" height="192" rx="34"/>
    </clipPath>
    <mask id="soft-mask">
      <rect width="400" height="240" fill="white"/>
      <circle cx="200" cy="115" r="26" fill="#777"/>
    </mask>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#183133" flood-opacity=".25"/>
    </filter>
  </defs>
  <g clip-path="url(#rounded-window)">
    <rect x="24" y="24" width="352" height="192" fill="#f8f7ef"/>
    <ellipse cx="200" cy="114" rx="132" ry="78" fill="url(#surface)" mask="url(#soft-mask)" filter="url(#soft-shadow)"/>
    <circle cx="200" cy="114" r="34" fill="url(#nucleus)" stroke="#6f4826" stroke-width="4"/>
    <path d="M82 115 C118 68 150 64 172 88 M228 140 C260 168 301 164 326 119" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="200" y="207" text-anchor="middle" fill="#183133" font-family="Source Sans 3" font-size="20">Export fidelity</text>
</svg>
