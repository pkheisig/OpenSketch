name: Refresh NIH BioArt assets

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets:sync
      - run: pnpm assets:validate
      - run: pnpm test
      - run: pnpm build
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/nih-bioart-refresh
          delete-branch: true
          commit-message: "chore(assets): refresh NIH BioArt collection"
          title: "Refresh NIH BioArt collection"
          body: |
            Manual OpenSketch asset synchronization.

            - fetched current Commons category metadata
            - sanitized changed SVGs
            - regenerated affected thumbnails and manifest
            - validated public-domain metadata and local hashes
          labels: assets
