name: Cross-browser smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: browser-compatibility
  cancel-in-progress: true

jobs:
  cross-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble-amd64
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Firefox and WebKit compatibility workflows
        run: pnpm test:e2e:cross-browser
